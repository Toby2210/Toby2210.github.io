<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Inspector for QA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-6 space-y-6">
        <div class="flex items-center justify-between border-b border-slate-700 pb-4">
            <h1 class="text-xl font-bold tracking-wide text-indigo-400">Device Inspector</h1>
            <span class="px-2.5 py-1 text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full">Live</span>
        </div>

        <div class="space-y-4">
            <!-- Device Model -->
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
                <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Device Model</p>
                <p id="deviceModel" class="text-lg font-semibold text-slate-200 mt-1">Detecting...</p>
            </div>

            <!-- Operating System -->
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
                <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Operating System</p>
                <p id="deviceOS" class="text-lg font-semibold text-slate-200 mt-1">Detecting...</p>
            </div>

            <!-- Screen Size -->
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
                <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Actual Screen Size</p>
                <p id="screenSize" class="text-lg font-semibold text-slate-200 mt-1">Detecting...</p>
            </div>
        </div>

        <button id="copyBtn" onclick="copyInfo()" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium rounded-xl transition-all shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
            Copy Device Info
        </button>
    </div>

    <script>
        let infoText = "";

        async function detectDevice() {
            const ua = navigator.userAgent;
            let model = "Unknown Device";
            let os = "Unknown OS";

            // 1. OS Detection
            if (/windows nt 10.0/i.test(ua)) os = "Windows 11 / 10";
            else if (/windows nt 6.3/i.test(ua)) os = "Windows 8.1";
            else if (/windows nt 6.2/i.test(ua)) os = "Windows 8";
            else if (/windows nt 6.1/i.test(ua)) os = "Windows 7";
            else if (/mac os x/i.test(ua)) {
                os = "macOS";
                const match = ua.match(/Mac OS X (\d+_[_,\d]+)/);
                if (match) os += ` ${match[1].replace(/_/g, '.')}`;
            } else if (/iphone|ipad|ipod/i.test(ua)) {
                os = "iOS";
                const match = ua.match(/OS (\d+_[_,\d]+)/);
                if (match) os = `iOS ${match[1].replace(/_/g, '.')}`;
            } else if (/android/i.test(ua)) {
                os = "Android";
                const match = ua.match(/Android\s([0-9\.]+)/);
                if (match) os = `Android ${match[1]}`;
            } else if (/linux/i.test(ua)) {
                os = "Linux";
            }

            // 2. Model Detection
            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                try {
                    const hints = await navigator.userAgentData.getHighEntropyValues(['model']);
                    if (hints.model) {
                        model = hints.model;
                    }
                } catch (e) {}
            }

            if (model === "Unknown Device") {
                if (/iphone/i.test(ua)) model = "iPhone";
                else if (/ipad/i.test(ua)) model = "iPad";
                else if (/macintosh|mac os x/i.test(ua)) model = "Mac PC";
                else if (/windows/i.test(ua)) model = "Windows PC";
                else if (/samsung/i.test(ua) || /sm-/i.test(ua)) {
                    model = "Samsung Galaxy Device";
                    const smMatch = ua.match(/(SM-[A-Z0-9]+)/i);
                    if (smMatch) model += ` (${smMatch[1]})`;
                } else if (/pixel/i.test(ua)) {
                    model = "Google Pixel";
                } else if (/android/i.test(ua)) {
                    model = "Android Device";
                }
            }

            // 3. Actual Screen Resolution
            const screenWidth = window.screen.width;
            const screenHeight = window.screen.height;
            const dpr = window.devicePixelRatio || 1;
            const physicalWidth = Math.round(screenWidth * dpr);
            const physicalHeight = Math.round(screenHeight * dpr);
            const screenSizeStr = `${screenWidth} x ${screenHeight} px (Physical: ${physicalWidth} x ${physicalHeight} px, DPR: ${dpr})`;

            // Render on UI
            document.getElementById('deviceModel').innerText = model;
            document.getElementById('deviceOS').innerText = os;
            document.getElementById('screenSize').innerText = screenSizeStr;

            // Prepare clipboard text (Clean format without User-Agent)
            infoText = `Device Model: ${model}\nOS: ${os}\nScreen Size: ${screenSizeStr}`;
        }

        function copyInfo() {
            navigator.clipboard.writeText(infoText).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Copied Successfully!`;
                btn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
                btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500');
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
                    btn.classList.add('bg-indigo-600', 'hover:bg-indigo-500');
                }, 2000);
            });
        }

        detectDevice();
    </script>
</body>
</html>
