<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Fast Transfer</title>
  <meta name="version" content="1.0.10">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="P2P Transfer">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/streamsaver@2.0.6/StreamSaver.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; line-height: 1.6; color: #333; }
    .page-header { max-width: 1400px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .page-header h2 { margin: 0; }
    .device-profile-hint { font-size: 12px; color: #666; margin: 4px 0 0; line-height: 1.4; }
    .sessions { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
    .session { position: relative; min-width: 0; }
    .session-card { border: 1px solid #ddd; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); background: #fff; }
    .session-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .section-title { font-size: 14px; margin: 0; }
    .close-btn { width: auto; border: none; background: transparent; color: #999; font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 8px; border-radius: 6px; }
    .close-btn:hover { background: #fdecec; color: #e63946; }
    .close-btn:disabled { background: transparent; color: #ccc; cursor: not-allowed; }
    .close-btn:disabled:hover { background: transparent; }
    .drop-zone { border: 2px dashed #007bff; border-radius: 8px; padding: 25px; text-align: center; color: #666; cursor: pointer; transition: background 0.2s, border-color 0.2s; background: #f8f9fa; }
    .drop-zone.dragover { background: #e9f2ff; border-color: #0056b3; color: #0056b3; }
    .drop-zone p { margin: 0; font-size: 14px; }
    .file-list-preview { margin-top: 10px; font-size: 13px; color: #555; text-align: left; word-break: break-all; max-height: 80px; overflow-y: auto; }
    .code-display { font-size: 32px; font-weight: bold; letter-spacing: 4px; color: #e63946; text-align: center; margin: 10px 0; }
    .timer { text-align: center; color: #d90429; font-weight: bold; font-size: 14px; margin-bottom: 10px; }
    input[type="tel"] { font-size: 20px; letter-spacing: 2px; text-align: center; width: 100%; padding: 10px; box-sizing: border-box; margin-bottom: 10px; }
    button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: 600; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    .status { font-weight: bold; color: #555; margin-top: 10px; text-align: center; word-break: break-all; min-height: 3.2em; }
    .speed-info { font-size: 13px; color: #007bff; text-align: center; margin-top: 5px; font-weight: bold; }
    progress { width: 100%; height: 20px; margin-top: 10px; display: none; }
    .add-session-btn { min-height: 120px; border: 2px dashed #007bff; border-radius: 12px; background: #f8f9fa; color: #007bff; font-size: 40px; font-weight: 300; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: background 0.2s, color 0.2s; }
    .add-session-btn span { font-size: 14px; font-weight: 600; }
    .add-session-btn:hover { background: #e9f2ff; color: #0056b3; }
    @media (min-width: 600px) {
      .sessions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 900px) {
      .sessions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1200px) {
      .sessions { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>

  <div class="page-header">
    <div>
      <h2>P2P Fast Transfer</h2>
      <p class="device-profile-hint" id="device-profile-hint">Detecting device…</p>
    </div>
  </div>

  <div class="sessions" id="sessions">
    <button class="add-session-btn" id="add-tile" onclick="addSession()">+<span>New Session</span></button>
  </div>

  <script>
    if (typeof streamSaver !== 'undefined') {
      streamSaver.mitm = new URL('mitm.html', window.location.href).href;
    }

    const P2P_DEBUG = true;
    function p2pLog(side, event, detail) {
      if (!P2P_DEBUG) return;
      if (detail === undefined) {
        console.log(`[P2P Transfer][${side}] ${event}`);
      } else {
        console.log(`[P2P Transfer][${side}] ${event}`, detail);
      }
    }

    const ICE_SERVERS = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' }
    ];
    const PEER_CONN_OPTS = { reliable: true, serialization: 'binary' };
    const KEY_TTL_SECONDS = 10 * 60;

    function isMobileDevice() {
      return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    }

    function isIOSDevice() {
      return /iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    function getNetworkInfo() {
      const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (!conn) {
        return { effectiveType: 'unknown', downlinkMbps: null, rttMs: null, saveData: false };
      }
      return {
        effectiveType: conn.effectiveType || 'unknown',
        downlinkMbps: typeof conn.downlink === 'number' ? conn.downlink : null,
        rttMs: typeof conn.rtt === 'number' ? conn.rtt : null,
        saveData: conn.saveData === true
      };
    }

    function detectDeviceProfile() {
      const mobile = isMobileDevice();
      const deviceMemoryGB = typeof navigator.deviceMemory === 'number' ? navigator.deviceMemory : null;
      const hardwareConcurrency = navigator.hardwareConcurrency || 4;
      const network = getNetworkInfo();

      let score = 50;
      if (deviceMemoryGB != null) {
        if (deviceMemoryGB >= 8) score += 28;
        else if (deviceMemoryGB >= 4) score += 18;
        else if (deviceMemoryGB >= 2) score += 6;
        else score -= 18;
      } else if (!mobile) {
        score += 12;
      }

      if (hardwareConcurrency >= 8) score += 12;
      else if (hardwareConcurrency >= 4) score += 6;
      else if (hardwareConcurrency <= 2) score -= 8;

      if (mobile) score -= 8;

      if (network.saveData) score -= 25;
      if (network.effectiveType === '4g') score += 8;
      if (network.downlinkMbps != null && network.downlinkMbps >= 15) score += 10;
      if (network.downlinkMbps != null && network.downlinkMbps < 5) score -= 10;
      if (network.effectiveType === '3g' || network.effectiveType === '2g' || network.effectiveType === 'slow-2g') {
        score -= 15;
      }

      let tier = 'medium';
      if (score >= 72) tier = 'high';
      else if (score <= 38) tier = 'low';

      const chunkSize = (() => {
        if (mobile) {
          if (isIOSDevice()) return 64 * 1024;
          if (tier === 'high' && deviceMemoryGB != null && deviceMemoryGB >= 4) return 512 * 1024;
          if (tier === 'medium') return 384 * 1024;
          return 256 * 1024;
        }
        if (tier === 'high') return 1024 * 1024;
        if (tier === 'low') return 512 * 1024;
        return 768 * 1024;
      })();

      const maxBufferedAmount = (() => {
        if (network.saveData || tier === 'low') return 8 * 1024 * 1024;
        if (mobile) {
          if (tier === 'high') return 24 * 1024 * 1024;
          return 16 * 1024 * 1024;
        }
        if (tier === 'high') return 64 * 1024 * 1024;
        if (tier === 'medium') return 32 * 1024 * 1024;
        return 16 * 1024 * 1024;
      })();

      const lowWaterMark = Math.max(
        512 * 1024,
        Math.min(maxBufferedAmount / 4, chunkSize * 4)
      );

      const receiveWriteBatchSize = (() => {
        if (mobile) return tier === 'high' ? 1024 * 1024 : 512 * 1024;
        if (tier === 'high') return 4 * 1024 * 1024;
        if (tier === 'low') return 1024 * 1024;
        return 2 * 1024 * 1024;
      })();

      const maxZipTotalBytes = (() => {
        if (deviceMemoryGB != null && deviceMemoryGB <= 2) return 128 * 1024 * 1024;
        if (deviceMemoryGB != null && deviceMemoryGB <= 4) return 256 * 1024 * 1024;
        if (tier === 'low') return 256 * 1024 * 1024;
        return 512 * 1024 * 1024;
      })();

      return {
        tier,
        score,
        mobile,
        deviceMemoryGB,
        hardwareConcurrency,
        network,
        transfer: {
          chunkSize,
          maxBufferedAmount,
          lowWaterMark,
          receiveWriteBatchSize,
          progressStep: mobile ? (tier === 'low' ? 8 : 5) : 2,
          progressIntervalMs: mobile ? 800 : 500,
          maxZipTotalBytes,
          readAheadChunks: tier === 'high' && !mobile ? 2 : 1
        },
        iceCandidatePoolSize: tier === 'high' ? 10 : 6
      };
    }

    let DEVICE_PROFILE = detectDeviceProfile();

    function getPeerRtcConfig() {
      return {
        iceServers: ICE_SERVERS,
        iceCandidatePoolSize: DEVICE_PROFILE.iceCandidatePoolSize
      };
    }

    function refreshDeviceProfile() {
      DEVICE_PROFILE = detectDeviceProfile();
      applyDeviceProfileUi();
      console.info('[P2P Transfer] Device profile updated', DEVICE_PROFILE);
    }

    function applyDeviceProfileUi() {
      const el = document.getElementById('device-profile-hint');
      if (!el) return;
      const p = DEVICE_PROFILE;
      const memLabel = p.deviceMemoryGB != null ? `${p.deviceMemoryGB} GB RAM` : 'RAM unavailable';
      const net = p.network;
      const netLabel = net.downlinkMbps != null
        ? `${net.effectiveType}, ~${net.downlinkMbps} Mbps`
        : net.effectiveType;
      const t = p.transfer;
      el.textContent =
        `Performance tier: ${p.tier} · ${memLabel} · ${p.hardwareConcurrency} CPU cores · ` +
        `Network: ${netLabel} · Send chunk ${Math.round(t.chunkSize / 1024)} KB · ` +
        `Buffer ${Math.round(t.maxBufferedAmount / (1024 * 1024))} MB`;
    }

    function getChunkSize(conn) {
      let size = DEVICE_PROFILE.transfer.chunkSize;
      const dc = conn?.dataChannel;
      if (dc && typeof dc.maxMessageSize === 'number' && dc.maxMessageSize > 0) {
        size = Math.min(size, dc.maxMessageSize);
      }
      if (isIOSDevice()) {
        size = Math.min(size, 64 * 1024);
      }
      return Math.max(16 * 1024, size);
    }

    function getMaxBufferedAmount() {
      return DEVICE_PROFILE.transfer.maxBufferedAmount;
    }

    function getLowWaterMark() {
      return DEVICE_PROFILE.transfer.lowWaterMark;
    }

    function getReceiveWriteBatchSize() {
      return DEVICE_PROFILE.transfer.receiveWriteBatchSize;
    }

    function getMaxZipTotalBytes() {
      return DEVICE_PROFILE.transfer.maxZipTotalBytes;
    }

    function tuneDataChannel(conn) {
      const dc = conn.dataChannel;
      if (!dc) return;
      dc.binaryType = 'arraybuffer';
      dc.bufferedAmountLowThreshold = getLowWaterMark();
    }

    async function describeIcePath(conn) {
      const pc = conn.peerConnection;
      if (!pc) return '';
      const stats = await pc.getStats();
      const candidates = new Map();
      stats.forEach((r) => {
        if (r.type === 'local-candidate' || r.type === 'remote-candidate') {
          candidates.set(r.id, r);
        }
      });
      let selected = null;
      stats.forEach((r) => {
        if (r.type === 'candidate-pair' && (r.selected || r.nominated)) selected = r;
      });
      if (!selected) return '';
      const local = candidates.get(selected.localCandidateId);
      const remote = candidates.get(selected.remoteCandidateId);
      if (!local || !remote) return '';
      const localType = local.candidateType || '?';
      const remoteType = remote.candidateType || '?';
      if (localType === 'relay' || remoteType === 'relay') {
        return `Link: relay (needs TURN server for best speed)`;
      }
      return `Link: direct (${localType} → ${remoteType})`;
    }

    function isBinaryPayload(data) {
      return data instanceof ArrayBuffer
        || ArrayBuffer.isView(data);
    }

    function toUint8Array(chunk) {
      if (chunk instanceof Uint8Array) return chunk;
      if (chunk instanceof ArrayBuffer) return new Uint8Array(chunk);
      if (ArrayBuffer.isView(chunk)) {
        return new Uint8Array(chunk.buffer, chunk.byteOffset, chunk.byteLength);
      }
      return new Uint8Array(chunk);
    }

    function binaryByteLength(data) {
      if (data instanceof ArrayBuffer) return data.byteLength;
      if (ArrayBuffer.isView(data)) return data.byteLength;
      return 0;
    }

    async function waitForBufferLow(conn) {
      const dc = conn.dataChannel;
      if (!dc || dc.bufferedAmount <= getMaxBufferedAmount()) return;
      await new Promise((resolve) => {
        const onLow = () => {
          dc.removeEventListener('bufferedamountlow', onLow);
          resolve();
        };
        dc.addEventListener('bufferedamountlow', onLow);
      });
    }

    async function drainSendBuffer(conn, label = 'drain') {
      const dc = conn.dataChannel;
      if (!dc) {
        p2pLog('send', `${label}: no dataChannel`);
        return { ok: true, remaining: 0, elapsed: 0 };
      }
      const maxWaitMs = isIOSDevice() ? 12000 : 45000;
      const start = Date.now();
      let lastLogAt = start;
      while (dc.bufferedAmount > 0) {
        const elapsed = Date.now() - start;
        if (elapsed > maxWaitMs) {
          p2pLog('send', `${label}: TIMEOUT (continuing anyway)`, {
            remaining: dc.bufferedAmount,
            elapsed
          });
          dc.bufferedAmountLowThreshold = getLowWaterMark();
          return { ok: false, remaining: dc.bufferedAmount, elapsed };
        }
        if (Date.now() - lastLogAt >= 2000) {
          p2pLog('send', `${label}: waiting for buffer`, {
            remaining: dc.bufferedAmount,
            elapsed
          });
          lastLogAt = Date.now();
        }
        await new Promise((resolve) => {
          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            dc.removeEventListener('bufferedamountlow', onLow);
            clearTimeout(pollTimer);
            resolve();
          };
          const onLow = () => {
            if (dc.bufferedAmount === 0) finish();
          };
          const pollTimer = setTimeout(finish, 250);
          dc.bufferedAmountLowThreshold = 0;
          dc.addEventListener('bufferedamountlow', onLow);
          if (dc.bufferedAmount === 0) finish();
        });
      }
      dc.bufferedAmountLowThreshold = getLowWaterMark();
      const elapsed = Date.now() - start;
      p2pLog('send', `${label}: drained`, { elapsed, remaining: dc.bufferedAmount });
      return { ok: true, remaining: 0, elapsed };
    }

    function sendAllEndWithRetry(conn) {
      const dc = conn.dataChannel;
      const payload = { type: 'ALL_END', ts: Date.now() };
      conn.send(payload);
      p2pLog('send', 'ALL_END', { bufferedAmount: dc?.bufferedAmount ?? null });
      for (let i = 1; i <= 4; i++) {
        setTimeout(() => {
          try {
            if (!conn.open) return;
            conn.send({ type: 'ALL_END', ts: Date.now(), retry: i });
            p2pLog('send', 'ALL_END retry', { retry: i, bufferedAmount: dc?.bufferedAmount ?? null });
          } catch (err) {
            p2pLog('send', 'ALL_END retry failed', { retry: i, err: String(err) });
          }
        }, 350 * i);
      }
    }

    function createDeliveredSpeedTracker() {
      let lastSent = 0;
      let lastBuffered = 0;
      let lastTime = Date.now();
      return function update(bytesSentTotal, dc) {
        const now = Date.now();
        if (now - lastTime < 400) return null;
        const buffered = dc?.bufferedAmount ?? 0;
        const delivered = bytesSentTotal - buffered;
        const prevDelivered = lastSent - lastBuffered;
        const speed = (delivered - prevDelivered) / ((now - lastTime) / 1000);
        lastSent = bytesSentTotal;
        lastBuffered = buffered;
        lastTime = now;
        return Math.max(0, speed);
      };
    }

    function uniqueZipEntryName(name, usedNames) {
      const base = (name && String(name).trim()) || 'file';
      if (!usedNames.has(base)) {
        usedNames.add(base);
        return base;
      }
      const dot = base.lastIndexOf('.');
      const stem = dot > 0 ? base.slice(0, dot) : base;
      const ext = dot > 0 ? base.slice(dot) : '';
      let i = 1;
      let candidate = `${stem}_${i}${ext}`;
      while (usedNames.has(candidate)) {
        i += 1;
        candidate = `${stem}_${i}${ext}`;
      }
      usedNames.add(candidate);
      return candidate;
    }

    function toTransferEntry(fileOrEntry) {
      if (fileOrEntry && fileOrEntry.source) return fileOrEntry;
      return {
        name: fileOrEntry.name,
        size: fileOrEntry.size,
        source: fileOrEntry,
        fileType: fileOrEntry.type || 'application/octet-stream'
      };
    }

    async function buildZipBlobFromFiles(files, onProgress) {
      const zip = new JSZip();
      const usedNames = new Set();
      for (const f of files) {
        const entryName = uniqueZipEntryName(f.name, usedNames);
        const payload = await f.arrayBuffer();
        if (!payload || payload.byteLength === 0) {
          console.warn('[P2P Transfer] Skipping empty/unreadable file:', f.name);
          continue;
        }
        zip.file(entryName, payload);
      }
      const entries = Object.keys(zip.files).filter((k) => !zip.files[k].dir);
      if (entries.length === 0) {
        throw new Error('Could not read any selected files for ZIP (try fewer files or send again).');
      }
      const zipOptions = isIOSDevice() || isMobileDevice()
        ? { type: 'uint8array', compression: 'STORE' }
        : { type: 'blob', compression: 'STORE', streamFiles: true };
      const generated = await zip.generateAsync(zipOptions, onProgress);
      if (generated instanceof Blob) {
        return generated;
      }
      return new Blob([generated], { type: 'application/zip' });
    }

    function createReceiveWriteStream(filename) {
      return streamSaver.createWriteStream(filename);
    }

    function shouldUseMemoryDownload(expectedSize, batchFileCount) {
      if (isMobileDevice()) return false;
      if (batchFileCount > 1) return false;
      if (!expectedSize || expectedSize <= 0) return true;
      return expectedSize <= getMaxZipTotalBytes();
    }

    function triggerBrowserBlobDownload(filename, parts, mimeType) {
      const blob = new Blob(parts, { type: mimeType || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      anchor.rel = 'noopener';
      anchor.style.display = 'none';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60_000);
      return blob.size;
    }

    async function streamSourceOverConn(conn, entry, onOffset) {
      const { name, source, fileType } = toTransferEntry(entry);
      const chunkSize = getChunkSize(conn);
      const readAhead = isIOSDevice() ? 1 : DEVICE_PROFILE.transfer.readAheadChunks;
      const totalSize = typeof entry.size === 'number' ? entry.size : source.size;
      if (!totalSize || totalSize <= 0) {
        throw new Error(`Cannot send empty file: ${name}`);
      }

      conn.send({
        type: 'FILE_HEADER',
        name,
        size: totalSize,
        fileType: fileType || 'application/octet-stream'
      });

      const dc = conn.dataChannel;
      let offset = 0;

      const readSlice = (start, end) => source.slice(start, end).arrayBuffer();

      let nextRead = readSlice(0, Math.min(chunkSize, totalSize));
      let aheadRead = null;
      if (readAhead > 1 && totalSize > chunkSize) {
        aheadRead = readSlice(chunkSize, Math.min(chunkSize * 2, totalSize));
      }

      while (offset < totalSize) {
        while (offset < totalSize && (!dc || dc.bufferedAmount <= getMaxBufferedAmount())) {
          const buffer = await nextRead;
          const chunkLen = buffer.byteLength;
          if (chunkLen === 0) {
            throw new Error(`Read failed at byte ${offset} for ${name} (Safari/iOS blob read)`);
          }
          conn.send(buffer);
          offset += chunkLen;
          if (onOffset) onOffset(offset);

          if (offset >= totalSize) break;

          if (aheadRead) {
            nextRead = aheadRead;
            const aheadStart = offset + chunkSize;
            aheadRead = aheadStart < totalSize
              ? readSlice(aheadStart, Math.min(aheadStart + chunkSize, totalSize))
              : null;
          } else {
            const nextEnd = Math.min(offset + chunkSize, totalSize);
            nextRead = readSlice(offset, nextEnd);
          }
        }
        if (offset < totalSize) {
          await waitForBufferLow(conn);
        }
      }

      if (offset !== totalSize) {
        throw new Error(`Sent ${offset} bytes but expected ${totalSize} for ${name}`);
      }
      return offset;
    }

    let sessionCounter = 0;

    function generate6DigitCode() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    function formatSpeed(bytesPerSec) {
      if (bytesPerSec > 1024 * 1024) return (bytesPerSec / (1024 * 1024)).toFixed(1) + ' MB/s';
      return (bytesPerSec / 1024).toFixed(1) + ' KB/s';
    }

    function formatEta(seconds) {
      if (!Number.isFinite(seconds) || seconds <= 0) return '0s';
      const total = Math.ceil(seconds);
      if (total < 60) return `${total}s`;
      if (total < 3600) {
        const mins = Math.ceil(total / 60);
        return `${mins}m`;
      }
      const hours = Math.floor(total / 3600);
      const mins = Math.ceil((total % 3600) / 60);
      if (mins === 60) return `${hours + 1}h`;
      return mins > 0 ? `${hours}h ${mins}m` : `${hours}h`;
    }

    // --- Session management ---
    function addSession() {
      sessionCounter++;
      const n = sessionCounter;

      const wrapper = document.createElement('div');
      wrapper.className = 'session';
      wrapper.innerHTML = `
        <div class="session-card">
          <!-- Sender -->
          <div class="session-header">
            <h3 class="section-title">1. Send Files</h3>
            <button class="close-btn" id="close-btn-${n}" title="Close session" onclick="closeSession(${n})">×</button>
          </div>
          <div class="drop-zone" onclick="document.getElementById('file-input-${n}').click()">
            <p>📁 Drag & Drop files here or <strong>browse</strong></p>
            <input type="file" id="file-input-${n}" multiple accept="*/*" style="display: none;" onchange="handleFileSelect(${n}, this.files)" />
            <div class="file-list-preview" id="file-preview-${n}"></div>
          </div>
          <br>
          <button id="send-btn-${n}" onclick="startSending(${n})">Generate Code & Send</button>

          <div id="send-area-${n}" style="display:none;">
            <p style="text-align: center; margin-bottom: 0;">Receive Key (6 Digits):</p>
            <div class="code-display" id="passkey-display-${n}">------</div>
            <div class="timer" id="timer-display-${n}">Expires in: 10:00</div>
          </div>

          <progress id="send-progress-${n}" value="0" max="100"></progress>
          <div class="speed-info" id="send-speed-${n}"></div>
          <div class="status" id="send-status-${n}"></div>

          <!-- Receiver -->
          <h3 style="font-size: 14px; margin: 18px 0 10px;">2. Receive Files</h3>
          <input type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" id="receive-code-${n}" placeholder="Enter 6-digit Key" maxlength="6" />
          <button id="receive-btn-${n}" onclick="startReceiving(${n})">Receive Files</button>

          <progress id="receive-progress-${n}" value="0" max="100"></progress>
          <div class="speed-info" id="receive-speed-${n}"></div>
          <div class="status" id="receive-status-${n}"></div>
        </div>
      `;

      const sessionsEl = document.getElementById('sessions');
      const addTile = document.getElementById('add-tile');
      sessionsEl.insertBefore(wrapper, addTile);

      // Per-session state
      const session = {
        n,
        wrapper,
        selectedFiles: [],
        sendPeer: null,
        receivePeer: null,
        expireTimer: null,
        countdownInterval: null,
        sendActive: false
      };
      sessions.set(n, session);

      // Drag & Drop Handlers
      const dropZone = wrapper.querySelector('.drop-zone');
      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.add('dragover');
        }, false);
      });
      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.remove('dragover');
        }, false);
      });
      dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        if (dt.files && dt.files.length > 0) {
          handleFileSelect(n, dt.files);
        }
      });

      // Enter Key Trigger for Code Input
      wrapper.querySelector(`#receive-code-${n}`).addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          startReceiving(n);
        }
      });

      // Numbers-only filter for Code Input (blocks letters/symbols from keyboard or paste)
      wrapper.querySelector(`#receive-code-${n}`).addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
      });

      return session;
    }

    const sessions = new Map();

    function closeSession(n) {
      const session = sessions.get(n);
      if (!session) return;
      if (session.sendActive) {
        alert('Cannot close: a transfer key is active. Wait for the transfer to complete or the key to expire.');
        return;
      }
      cleanupSession(session);
      sessions.delete(n);
      session.wrapper.remove();
    }

    function cleanupSession(session) {
      const { n } = session;
      if (session.expireTimer) clearTimeout(session.expireTimer);
      if (session.countdownInterval) clearInterval(session.countdownInterval);
      if (session.sendPeer) {
        session.sendPeer.destroy();
        session.sendPeer = null;
      }
      if (session.receivePeer) {
        session.receivePeer.destroy();
        session.receivePeer = null;
      }
      session.selectedFiles = [];
    }

    function handleFileSelect(n, files) {
      const session = sessions.get(n);
      if (!session) return;
      session.selectedFiles = Array.from(files);
      const preview = document.getElementById(`file-preview-${n}`);
      if (session.selectedFiles.length === 1) {
        preview.innerText = `Selected: ${session.selectedFiles[0].name}`;
      } else if (session.selectedFiles.length > 1) {
        preview.innerText = `Selected ${session.selectedFiles.length} files (${session.selectedFiles.map(f => f.name).join(', ')})`;
      } else {
        preview.innerText = '';
      }
    }

    function cleanupSendState(session, message = '') {
      const { n } = session;
      if (session.expireTimer) clearTimeout(session.expireTimer);
      if (session.countdownInterval) clearInterval(session.countdownInterval);
      if (session.sendPeer) {
        session.sendPeer.destroy();
        session.sendPeer = null;
      }
      session.selectedFiles = [];
      session.sendActive = false;
      const closeBtn = document.getElementById(`close-btn-${n}`);
      if (closeBtn) closeBtn.disabled = false;
      document.getElementById(`send-area-${n}`).style.display = 'none';
      document.getElementById(`send-btn-${n}`).disabled = false;
      document.getElementById(`file-input-${n}`).value = '';
      document.getElementById(`file-preview-${n}`).innerText = '';
      document.getElementById(`send-speed-${n}`).innerText = '';
      if (message) document.getElementById(`send-status-${n}`).innerText = message;
    }

    // --- Sender ---
    async function startSending(n) {
      const session = sessions.get(n);
      if (!session) return;
      if (session.selectedFiles.length === 0) {
        alert('Please select or drop at least one file!');
        return;
      }

      const files = [...session.selectedFiles];
      const sendBtn = document.getElementById(`send-btn-${n}`);
      const sendStatus = document.getElementById(`send-status-${n}`);
      const sendProgress = document.getElementById(`send-progress-${n}`);
      const sendSpeed = document.getElementById(`send-speed-${n}`);

      sendBtn.disabled = true;
      sendSpeed.innerText = '';

      const passkey = generate6DigitCode();
      if (session.sendPeer) session.sendPeer.destroy();

      session.sendPeer = new Peer(passkey, { config: getPeerRtcConfig() });

      session.sendPeer.on('open', (id) => {
        document.getElementById(`passkey-display-${n}`).innerText = id;
        document.getElementById(`send-area-${n}`).style.display = 'block';
        session.sendActive = true;
        const closeBtn = document.getElementById(`close-btn-${n}`);
        if (closeBtn) closeBtn.disabled = true;
        startTimer(session, KEY_TTL_SECONDS);
      });

      session.sendPeer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          startSending(n);
        } else {
          cleanupSendState(session, 'Connection error: ' + err.message);
        }
      });

      const preparePayloadPromise = (async () => {
        if (files.length === 1) {
          sendStatus.innerText = 'Waiting for recipient...';
          return { mode: 'single', files: [toTransferEntry(files[0])] };
        }

        const totalBytes = files.reduce((sum, f) => sum + f.size, 0);
        if (totalBytes <= getMaxZipTotalBytes()) {
          sendProgress.style.display = 'block';
          sendProgress.value = 0;
          sendStatus.innerText = 'Creating ZIP archive: 0%';

          try {
            const zipBlob = await buildZipBlobFromFiles(files, (metadata) => {
              const percent = Math.floor(metadata.percent);
              sendProgress.value = percent;
              sendStatus.innerText = `Creating ZIP archive: ${percent}%`;
            });

            sendStatus.innerText = 'ZIP ready. Waiting for recipient...';
            sendProgress.style.display = 'none';

            const zipName = `archive_${Date.now()}.zip`;
            return {
              mode: 'single',
              files: [{
                name: zipName,
                size: zipBlob.size,
                source: zipBlob,
                fileType: 'application/zip'
              }]
            };
          } catch (err) {
            console.warn('ZIP packaging failed, falling back to sequential send:', err);
            sendProgress.style.display = 'none';
            sendStatus.innerText = 'ZIP skipped (too large). Will send files one by one...';
          }
        } else {
          sendStatus.innerText = `Large bundle (${files.length} files). Will send sequentially without ZIP...`;
        }

        return { mode: 'multi', files: files.map(toTransferEntry) };
      })();

      session.sendPeer.on('connection', (conn) => {
        if (session.expireTimer) clearTimeout(session.expireTimer);
        if (session.countdownInterval) clearInterval(session.countdownInterval);

        conn.on('open', async () => {
          try {
            sendStatus.innerText = 'Confirming file package...';
            const payload = await preparePayloadPromise;

            tuneDataChannel(conn);

            sendStatus.innerText = 'Sending file...';
            sendProgress.style.display = 'block';
            sendProgress.value = 0;

            const totalBytes = payload.files.reduce((sum, f) => sum + f.size, 0);
            let bytesSentTotal = 0;
            const updateDeliveredSpeed = createDeliveredSpeedTracker();
            const dc = conn.dataChannel;

            const onFileProgress = () => {
              const speed = updateDeliveredSpeed(bytesSentTotal, dc);
              if (speed != null) {
                sendSpeed.innerText = `Speed: ${formatSpeed(speed)}`;
              }
            };

            if (payload.mode === 'multi') {
              conn.send({
                type: 'BATCH_START',
                fileCount: payload.files.length,
                totalBytes
              });
            }

            let bytesSentBeforeCurrent = 0;
            for (let i = 0; i < payload.files.length; i++) {
              const file = payload.files[i];
              sendStatus.innerText = payload.files.length > 1
                ? `Sending file ${i + 1}/${payload.files.length}: ${file.name}...`
                : 'Sending file...';

              const bytesSentForFile = await streamSourceOverConn(conn, file, (fileOffset) => {
                bytesSentTotal = bytesSentBeforeCurrent + fileOffset;
                if (totalBytes > 0) {
                  sendProgress.value = Math.min(100, Math.round((bytesSentTotal / totalBytes) * 100));
                }
                onFileProgress();
              });

              conn.send({
                type: 'FILE_DONE',
                bytesSent: bytesSentForFile,
                name: file.name
              });
              p2pLog('send', 'FILE_DONE', {
                name: file.name,
                bytesSent: bytesSentForFile,
                bufferedAmount: dc?.bufferedAmount ?? null
              });

              const postFileDrain = await drainSendBuffer(conn, 'post-file');
              p2pLog('send', 'post-file drain result', postFileDrain);

              bytesSentBeforeCurrent += file.size;

              if (payload.mode === 'multi') {
                conn.send({ type: 'FILE_END' });
                p2pLog('send', 'FILE_END', { name: file.name });
              }
            }

            const preAllEndDrain = await drainSendBuffer(conn, 'pre-all-end');
            p2pLog('send', 'pre-all-end drain result', preAllEndDrain);
            sendAllEndWithRetry(conn);
          } catch (err) {
            console.error(err);
            cleanupSendState(session, 'Send failed: ' + (err.message || err));
          }
        });

        conn.on('data', (data) => {
          if (data.type === 'PROGRESS') {
            if (data.percent >= 100) {
              p2pLog('send', 'recipient PROGRESS 100 (waiting for ACK)', data);
            }
            sendProgress.value = data.percent;
            sendStatus.innerText = `Recipient receiving... ${data.percent}%`;
            if (typeof data.speed === 'number' && data.speed > 0) {
              sendSpeed.innerText = `Speed: ${formatSpeed(data.speed)}`;
            }
          }
          else if (data.type === 'ACK') {
            p2pLog('send', 'ACK received from recipient');
            sendProgress.value = 100;
            sendProgress.style.display = 'none';
            cleanupSendState(session, 'Transfer complete! Key destroyed.');
          }
          else if (data.type === 'ERROR') {
            p2pLog('send', 'ERROR from recipient', data);
            cleanupSendState(session, 'Recipient reported error: ' + (data.message || 'unknown'));
          }
        });
      });
    }

    function startTimer(session, seconds) {
      const { n } = session;
      let timeLeft = seconds;
      const timerDisplay = document.getElementById(`timer-display-${n}`);
      if (session.expireTimer) clearTimeout(session.expireTimer);
      if (session.countdownInterval) clearInterval(session.countdownInterval);

      session.countdownInterval = setInterval(() => {
        timeLeft--;
        const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const secs = (timeLeft % 60).toString().padStart(2, '0');
        timerDisplay.innerText = `Expires in: ${mins}:${secs}`;
        if (timeLeft <= 0) clearInterval(session.countdownInterval);
      }, 1000);

      session.expireTimer = setTimeout(() => {
        cleanupSendState(session, 'Key expired (10 minutes elapsed).');
      }, seconds * 1000);
    }

    // --- Receiver ---
    async function startReceiving(n) {
      const session = sessions.get(n);
      if (!session) return;
      const codeInput = document.getElementById(`receive-code-${n}`).value.trim();
      const receiveStatus = document.getElementById(`receive-status-${n}`);
      const receiveProgress = document.getElementById(`receive-progress-${n}`);
      const receiveSpeed = document.getElementById(`receive-speed-${n}`);
      const receiveBtn = document.getElementById(`receive-btn-${n}`);

      if (codeInput.length !== 6 || isNaN(codeInput)) {
        alert('Please enter a valid 6-digit key!');
        return;
      }

      receiveBtn.disabled = true;
      receiveProgress.style.display = 'none';
      receiveSpeed.innerText = '';

      receiveStatus.innerText = 'Connecting...';

      if (session.receivePeer) session.receivePeer.destroy();
      const receivePeer = new Peer({ config: getPeerRtcConfig() });
      session.receivePeer = receivePeer;

      let currentFileMeta = null;
      let fileWriteStream = null;
      let writer = null;
      let totalReceivedSize = 0;
      let batchFileCount = 0;
      let batchFileIndex = 0;
      let batchBytesTotal = 0;
      let batchBytesReceived = 0;

      let lastTime = 0;
      let lastReceived = 0;
      let lastProgressPercent = -1;
      let lastProgressSentTime = 0;
      let writeChain = Promise.resolve();
      let writeBuffer = [];
      let writeBufferLen = 0;
      let useMemoryReceive = false;
      let memoryParts = [];
      let confirmedFileBytes = null;
      let receiveFinished = false;
      let finalizeWatchdog = null;
      const writeBatchSize = getReceiveWriteBatchSize();

      function clearFinalizeWatchdog() {
        if (finalizeWatchdog) {
          clearTimeout(finalizeWatchdog);
          finalizeWatchdog = null;
        }
      }

      function armFinalizeWatchdog(conn, reason, delayMs = 1800) {
        clearFinalizeWatchdog();
        finalizeWatchdog = setTimeout(() => {
          p2pLog('recv', 'finalize watchdog fired', {
            reason,
            receiveFinished,
            totalReceivedSize,
            expected: expectedReceiveBytes(),
            confirmedFileBytes,
            file: currentFileMeta?.name
          });
          if (!receiveFinished && currentFileMeta && totalReceivedSize > 0) {
            void finishReceiveTransfer(conn, `watchdog:${reason}`);
          }
        }, delayMs);
      }

      async function finishReceiveTransfer(conn, reason) {
        if (receiveFinished) {
          p2pLog('recv', 'finish skipped (already done)', { reason });
          return;
        }
        receiveFinished = true;
        clearFinalizeWatchdog();

        p2pLog('recv', 'finish start', {
          reason,
          totalReceivedSize,
          expected: confirmedFileBytes ?? currentFileMeta?.size,
          useMemoryReceive,
          parts: memoryParts.length,
          file: currentFileMeta?.name
        });

        let sizeOk = true;
        const expected = confirmedFileBytes != null
          ? confirmedFileBytes
          : (currentFileMeta ? currentFileMeta.size : null);

        if (useMemoryReceive && currentFileMeta) {
          const savedBytes = triggerBrowserBlobDownload(
            currentFileMeta.name,
            memoryParts,
            currentFileMeta.fileType
          );
          p2pLog('recv', 'blob download triggered', {
            savedBytes,
            totalReceivedSize,
            filename: currentFileMeta.name
          });
          memoryParts = [];
          useMemoryReceive = false;
          writer = null;
          fileWriteStream = null;
          sizeOk = expected == null || savedBytes === totalReceivedSize
            || (expected != null && totalReceivedSize >= expected * 0.995);
          if (!sizeOk && totalReceivedSize > 0 && savedBytes === totalReceivedSize) {
            sizeOk = true;
          }
        } else {
          flushWriteBuffer();
          await writeChain;
          if (writer) {
            sizeOk = await closeCurrentWriter(expected);
            if (!sizeOk && expected != null && totalReceivedSize > 0) {
              const shortBy = expected - totalReceivedSize;
              const ratio = totalReceivedSize / expected;
              if (shortBy > 0 && ratio >= 0.995) {
                p2pLog('recv', 'minor size shortfall accepted', { expected, totalReceivedSize, shortBy });
                sizeOk = true;
              }
            }
          }
        }

        receiveProgress.value = 100;
        if (!sizeOk) {
          p2pLog('recv', 'finish failed: size mismatch', {
            expected,
            totalReceivedSize
          });
          receiveStatus.innerText =
            'Download finished but size did not match (file may be incomplete). Try sending again.';
          conn.send({ type: 'ERROR', message: 'Size mismatch' });
          receiveBtn.disabled = false;
          return;
        }

        receiveStatus.innerText = batchFileCount > 1
          ? `Download complete! ${batchFileCount} files saved.`
          : 'Download complete! Saved to your browser\'s default download folder.';
        receiveSpeed.innerText = '';
        receiveProgress.style.display = 'none';
        receiveBtn.disabled = false;
        document.getElementById(`receive-code-${n}`).value = '';

        conn.send({ type: 'PROGRESS', percent: 100 });
        conn.send({ type: 'ACK' });
        p2pLog('recv', 'finish done — ACK sent', { reason });

        setTimeout(() => {
          if (session.receivePeer === receivePeer) {
            session.receivePeer = null;
          }
          receivePeer.destroy();
        }, 1000);
      }
      const progressStep = DEVICE_PROFILE.transfer.progressStep;
      const progressIntervalMs = DEVICE_PROFILE.transfer.progressIntervalMs;

      function flushWriteBuffer() {
        if (!writer || writeBufferLen === 0) return;
        const merged = new Uint8Array(writeBufferLen);
        let at = 0;
        for (const part of writeBuffer) {
          merged.set(part, at);
          at += part.byteLength;
        }
        writeBuffer = [];
        writeBufferLen = 0;
        writeChain = writeChain.then(() => writer.write(merged));
      }

      function queueChunkWrite(u8) {
        if (useMemoryReceive) {
          memoryParts.push(u8);
          return;
        }
        if (!writer) return;
        writeBuffer.push(u8);
        writeBufferLen += u8.byteLength;
        if (writeBufferLen >= writeBatchSize) flushWriteBuffer();
      }

      function expectedReceiveBytes() {
        if (confirmedFileBytes != null) return confirmedFileBytes;
        return currentFileMeta ? currentFileMeta.size : 0;
      }

      async function closeCurrentWriter(expectedSize) {
        if (useMemoryReceive) {
          return expectedSize == null || totalReceivedSize === expectedSize;
        }
        flushWriteBuffer();
        await writeChain;
        if (!writer) return true;
        const ok = expectedSize == null || totalReceivedSize === expectedSize;
        if (!ok) {
          console.warn(
            `[P2P Transfer] Size mismatch for ${currentFileMeta?.name || 'file'}: ` +
            `expected ${expectedSize}, received ${totalReceivedSize}`
          );
        }
        try {
          await writer.close();
        } catch (e) {
          console.error(e);
          try {
            await writer.abort();
          } catch (abortErr) {
            console.error(abortErr);
          }
          writer = null;
          fileWriteStream = null;
          return false;
        }
        writer = null;
        fileWriteStream = null;
        return ok;
      }

      async function handleIncomingMessage(conn, data) {
        if (data && data.type === 'CHUNK') {
          data = data.chunk;
        }

        if (!isBinaryPayload(data) && data && data.type) {
          p2pLog('recv', `control ${data.type}`, data);
        }

        if (isBinaryPayload(data)) {
          const byteLength = binaryByteLength(data);
          totalReceivedSize += byteLength;
          batchBytesReceived += byteLength;

          if (useMemoryReceive || writer) {
            queueChunkWrite(toUint8Array(data));
          }

          const now = Date.now();
          let recvSpeed = null;
          if (now - lastTime >= 500) {
            const diffBytes = batchBytesTotal > 0 ? batchBytesReceived - lastReceived : totalReceivedSize - lastReceived;
            recvSpeed = diffBytes / ((now - lastTime) / 1000);
            const expectedBytes = expectedReceiveBytes();
            const remainingBytes = batchBytesTotal > 0
              ? batchBytesTotal - batchBytesReceived
              : (expectedBytes > 0 ? expectedBytes - totalReceivedSize : 0);
            const etaSec = recvSpeed > 0 ? Math.ceil(remainingBytes / recvSpeed) : 0;
            receiveSpeed.innerText = `Speed: ${formatSpeed(recvSpeed)} | ETA: ${formatEta(etaSec)}`;
            lastTime = now;
            lastReceived = batchBytesTotal > 0 ? batchBytesReceived : totalReceivedSize;
          }

          const expectedBytes = expectedReceiveBytes();
          if (currentFileMeta && expectedBytes > 0) {
            const progress = batchBytesTotal > 0
              ? Math.min(99, Math.floor((batchBytesReceived / batchBytesTotal) * 100))
              : Math.min(99, Math.floor((totalReceivedSize / expectedBytes) * 100));
            receiveProgress.value = progress;
            const fileLabel = batchFileCount > 1
              ? ` (file ${batchFileIndex}/${batchFileCount})`
              : '';
            receiveStatus.innerText = `Downloading${fileLabel}... ${progress}%`;

            const atEnd = batchBytesTotal > 0
              ? batchBytesReceived >= batchBytesTotal
              : totalReceivedSize >= expectedBytes;

            if (atEnd) {
              receiveProgress.value = 100;
              receiveStatus.innerText = batchFileCount > 1
                ? `Finalizing${fileLabel}...`
                : `Finalizing ${currentFileMeta.name}...`;
              armFinalizeWatchdog(conn, 'bytes-complete');
            }

            const shouldSendProgress =
              atEnd ||
              progress - lastProgressPercent >= progressStep ||
              (now - lastProgressSentTime >= progressIntervalMs && progress !== lastProgressPercent);

            if (shouldSendProgress) {
              const speedForSender = recvSpeed != null && recvSpeed > 0 ? recvSpeed : undefined;
              conn.send({ type: 'PROGRESS', percent: atEnd ? 100 : progress, speed: speedForSender });
              if (atEnd) {
                p2pLog('recv', 'PROGRESS 100 sent to sender', {
                  totalReceivedSize,
                  expectedBytes,
                  confirmedFileBytes
                });
              }
              lastProgressPercent = progress;
              lastProgressSentTime = now;
            }

            if (totalReceivedSize > 0 && (totalReceivedSize % (256 * 1024) < byteLength || atEnd)) {
              p2pLog('recv', 'chunk milestone', {
                totalReceivedSize,
                expectedBytes,
                byteLength,
                atEnd,
                useMemoryReceive
              });
            }
          }
          return;
        }

        if (data.type === 'BATCH_START') {
          batchFileCount = data.fileCount || 0;
          batchFileIndex = 0;
          batchBytesTotal = data.totalBytes || 0;
          batchBytesReceived = 0;
          return;
        }

        if (data.type === 'FILE_DONE') {
          if (currentFileMeta && typeof data.bytesSent === 'number') {
            confirmedFileBytes = data.bytesSent;
            currentFileMeta.size = data.bytesSent;
            p2pLog('recv', 'FILE_DONE applied', {
              bytesSent: data.bytesSent,
              totalReceivedSize,
              gap: data.bytesSent - totalReceivedSize
            });
            if (totalReceivedSize >= data.bytesSent) {
              receiveProgress.value = 100;
              receiveStatus.innerText = `Finalizing ${currentFileMeta.name}...`;
              conn.send({ type: 'PROGRESS', percent: 100 });
              armFinalizeWatchdog(conn, 'file-done', 800);
            } else {
              armFinalizeWatchdog(conn, 'file-done-wait-bytes', 4000);
            }
          }
          return;
        }

        if (data.type === 'FILE_HEADER') {
          await writeChain;
          batchFileIndex += 1;
          currentFileMeta = data;
          confirmedFileBytes = null;
          totalReceivedSize = 0;
          memoryParts = [];
          writeChain = Promise.resolve();
          receiveProgress.style.display = 'block';
          lastTime = Date.now();
          lastReceived = batchBytesTotal > 0 ? batchBytesReceived : 0;
          lastProgressPercent = -1;
          lastProgressSentTime = 0;

          receiveFinished = false;
          useMemoryReceive = shouldUseMemoryDownload(currentFileMeta.size, batchFileCount);
          p2pLog('recv', 'FILE_HEADER', {
            name: currentFileMeta.name,
            size: currentFileMeta.size,
            useMemoryReceive,
            batchFileCount
          });
          if (useMemoryReceive) {
            writer = null;
            fileWriteStream = null;
            receiveStatus.innerText = `Receiving ${currentFileMeta.name}... 0%`;
          } else {
            fileWriteStream = createReceiveWriteStream(currentFileMeta.name);
            writer = fileWriteStream.getWriter();
            receiveStatus.innerText = `Downloading ${currentFileMeta.name}... 0%`;
          }
          return;
        }

        if (data.type === 'FILE_END') {
          const ok = await closeCurrentWriter(currentFileMeta ? currentFileMeta.size : null);
          if (!ok) {
            receiveStatus.innerText = `File incomplete: ${currentFileMeta?.name || 'unknown'}`;
            conn.send({ type: 'ERROR', message: 'Incomplete file' });
          }
          currentFileMeta = null;
          totalReceivedSize = 0;
          return;
        }

        if (data.type === 'ALL_END') {
          await finishReceiveTransfer(conn, data.retry != null ? `ALL_END:retry${data.retry}` : 'ALL_END');
        }
      }

      receivePeer.on('open', () => {
        const conn = receivePeer.connect(codeInput, PEER_CONN_OPTS);
        let messageChain = Promise.resolve();

        conn.on('open', async () => {
          tuneDataChannel(conn);
          let linkHint = '';
          try {
            linkHint = await describeIcePath(conn);
          } catch (e) {
            console.warn(e);
          }
          receiveStatus.innerText = linkHint
            ? `Connected. ${linkHint}`
            : 'Connected. Waiting for data...';
        });

        conn.on('data', (data) => {
          messageChain = messageChain
            .then(() => handleIncomingMessage(conn, data))
            .catch((err) => {
              console.error(err);
              if (writer && !useMemoryReceive) writer.abort().catch(() => {});
              receiveStatus.innerText = 'Receive error: ' + (err.message || err);
              receiveBtn.disabled = false;
            });
        });

        conn.on('error', () => {
          if (writer && !useMemoryReceive) writer.abort().catch(() => {});
          receiveStatus.innerText = 'Connection lost.';
          receiveBtn.disabled = false;
        });
      });

      receivePeer.on('error', () => {
        receiveStatus.innerText = 'Key invalid or expired.';
        receiveBtn.disabled = false;
      });
    }

    applyDeviceProfileUi();
    p2pLog('app', 'ready v1.0.10', {
      ios: isIOSDevice(),
      mobile: isMobileDevice(),
      tier: DEVICE_PROFILE.tier
    });
    console.info('[P2P Transfer] Device profile', DEVICE_PROFILE);
    const networkConn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (networkConn) {
      networkConn.addEventListener('change', refreshDeviceProfile);
    }

    const INITIAL_SESSIONS = 1;
    for (let i = 0; i < INITIAL_SESSIONS; i++) addSession();
  </script>
</body>
</html>
